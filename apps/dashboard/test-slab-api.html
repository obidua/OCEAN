<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slab API Tester</title>
    <style>
        body {
            font-family: monospace;
            background: #0a0f1e;
            color: #00ffff;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #1a1f2e;
            border: 1px solid #00ffff33;
            border-radius: 8px;
        }
        button {
            background: #00ffff33;
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #00ffff55;
        }
        .result {
            background: #000;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            white-space: pre-wrap;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        .loading { color: #ffff00; }
        input {
            background: #000;
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 8px;
            margin: 5px;
            border-radius: 4px;
            width: 400px;
        }
    </style>
</head>
<body>
    <h1>🌊 Ocean DeFi Slab API Tester</h1>
    
    <div class="section">
        <h3>Configuration</h3>
        <div>
            <label>User Address:</label><br>
            <input type="text" id="userAddress" value="0xa6EBDdFa8e3c669b5e5a9d3a2294B1052686025f">
        </div>
        <div>
            <label>API Base URL:</label><br>
            <input type="text" id="apiBase" value="https://testapi.oceandefi.uk/api">
        </div>
        <div>
            <label>Current Day ID: <span id="currentDay">0</span></label>
        </div>
    </div>

    <div class="section">
        <h3>Test API Endpoints</h3>
        <button onclick="testCombinedIncome()">Test Combined Income</button>
        <button onclick="testTeamSummary()">Test Team Summary</button>
        <button onclick="testPeriodIncome()">Test Period Income (30 days)</button>
        <button onclick="testClaimableIncome()">Test Claimable Income</button>
        <button onclick="testPortfolioVolume()">Test Portfolio Volume</button>
        <button onclick="testAllAPIs()">Test All APIs</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div class="section">
        <h3>Results</h3>
        <div id="results"></div>
    </div>

    <script>
        const calculateDayId = () => Math.floor(Date.now() / 1000 / 86400);
        
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('currentDay').textContent = calculateDayId();
        });

        function addResult(title, data, isError = false) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'result';
            div.innerHTML = `<strong class="${isError ? 'error' : 'success'}">${title}</strong>\n${JSON.stringify(data, null, 2)}`;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }

        function addLoading(title) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'result loading';
            div.id = 'loading-' + Date.now();
            div.innerHTML = `<strong>${title}</strong>\nLoading...`;
            results.appendChild(div);
            return div;
        }

        async function testCombinedIncome() {
            const addr = document.getElementById('userAddress').value;
            const apiBase = document.getElementById('apiBase').value;
            const dayId = calculateDayId();
            const loading = addLoading('GET /combined/{address}/{dayId}');
            
            try {
                const url = `${apiBase}/combined/${addr}/${dayId}?price_micro_usd=50000000`;
                const response = await fetch(url);
                const data = await response.json();
                loading.remove();
                addResult(`✅ Combined Income (Day ${dayId})`, data);
            } catch (error) {
                loading.remove();
                addResult('❌ Combined Income Error', error.message, true);
            }
        }

        async function testTeamSummary() {
            const addr = document.getElementById('userAddress').value;
            const apiBase = document.getElementById('apiBase').value;
            const loading = addLoading('GET /team-summary/{address}');
            
            try {
                const url = `${apiBase}/team-summary/${addr}`;
                const response = await fetch(url);
                const data = await response.json();
                loading.remove();
                addResult('✅ Team Summary', data);
            } catch (error) {
                loading.remove();
                addResult('❌ Team Summary Error', error.message, true);
            }
        }

        async function testPeriodIncome() {
            const addr = document.getElementById('userAddress').value;
            const apiBase = document.getElementById('apiBase').value;
            const currentDay = calculateDayId();
            const fromDay = Math.max(0, currentDay - 30);
            const loading = addLoading('GET /period/{address}');
            
            try {
                const url = `${apiBase}/period/${addr}?from_day=${fromDay}&to_day=${currentDay}&price_micro_usd=50000000`;
                const response = await fetch(url);
                const data = await response.json();
                loading.remove();
                addResult(`✅ Period Income (${fromDay} - ${currentDay})`, data);
            } catch (error) {
                loading.remove();
                addResult('❌ Period Income Error', error.message, true);
            }
        }

        async function testClaimableIncome() {
            const addr = document.getElementById('userAddress').value;
            const apiBase = document.getElementById('apiBase').value;
            const currentDay = calculateDayId();
            const loading = addLoading('GET /claimable/{address}');
            
            try {
                const url = `${apiBase}/claimable/${addr}?current_day=${currentDay}&price_micro_usd=50000000`;
                const response = await fetch(url);
                const data = await response.json();
                loading.remove();
                addResult(`✅ Claimable Income (up to Day ${currentDay})`, data);
            } catch (error) {
                loading.remove();
                addResult('❌ Claimable Income Error', error.message, true);
            }
        }

        async function testPortfolioVolume() {
            const addr = document.getElementById('userAddress').value;
            const apiBase = document.getElementById('apiBase').value;
            const loading = addLoading('GET /portfolio-volume/{address}');
            
            try {
                const url = `${apiBase}/portfolio-volume/${addr}`;
                const response = await fetch(url);
                const data = await response.json();
                loading.remove();
                addResult('✅ Portfolio Volume', data);
            } catch (error) {
                loading.remove();
                addResult('❌ Portfolio Volume Error', error.message, true);
            }
        }

        async function testAllAPIs() {
            clearResults();
            await testCombinedIncome();
            await new Promise(r => setTimeout(r, 500));
            await testTeamSummary();
            await new Promise(r => setTimeout(r, 500));
            await testPeriodIncome();
            await new Promise(r => setTimeout(r, 500));
            await testClaimableIncome();
            await new Promise(r => setTimeout(r, 500));
            await testPortfolioVolume();
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
    </script>
</body>
</html>
